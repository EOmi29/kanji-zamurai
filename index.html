  .kids-bg {

<body class="flex flex-col gap-2 p-2 select-none overflow-hidden kids-bg" style="height:100dvh">

<header class="w-full flex flex-wrap items-center justify-between gap-2 bg-white/85 border-2 border-orange-200 rounded-2xl px-4 py-2 shadow-md">
  <div class="flex items-center gap-3">
    <span class="text-4xl">⚔️</span>
    <div>
      <h1 class="samurai-title text-4xl text-orange-600 tracking-wider leading-none">漢字ざむらい</h1>
      <p class="text-sm text-stone-600 font-bold mt-1">～しっているパーツにきりわけよう～</p>
    </div>
  </div>
  <div class="flex items-center gap-2 flex-wrap">
    <label for="kanjiInput" class="text-base text-stone-700 font-bold">漢字をきめる</label>
    <input type="text" id="kanjiInput" maxlength="1" value="試" class="w-14 h-12 text-center text-2xl font-bold bg-white border-2 border-orange-300 rounded-xl text-stone-800 focus:outline-none focus:ring-4 focus:ring-orange-200">
    <button id="setKanjiBtn" class="h-12 bg-amber-300 hover:bg-amber-200 border-b-4 border-amber-500 text-stone-800 text-base font-black px-5 rounded-xl shadow transition active:translate-y-0.5 active:border-b-2 cursor-pointer">けってい</button>
    <button id="pickBtn" class="h-12 bg-white hover:bg-amber-50 border-2 border-amber-400 text-stone-800 text-base font-bold px-4 rounded-xl shadow-sm transition active:scale-95 cursor-pointer">📚 かんじをさがす</button>
    <button id="undoBtn" class="h-12 bg-white hover:bg-sky-50 border-2 border-sky-300 text-stone-700 text-base font-bold px-4 rounded-xl shadow-sm transition active:scale-95 cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">↩︎ もどす</button>
    <button id="resetBtn" class="h-12 bg-white hover:bg-rose-50 border-2 border-rose-300 text-stone-700 text-base font-bold px-4 rounded-xl shadow-sm transition active:scale-95 cursor-pointer">🔄 もとにもどす</button>
  </div>
</header>

<div class="flex-1 min-h-0 flex gap-2">
  <aside class="w-36 shrink-0 flex flex-col gap-2 bg-white/75 border-2 border-orange-200 rounded-2xl p-2 overflow-y-auto shadow-md">
    <button id="toolCut" aria-label="きる"><span class="text-4xl">🗡️</span><span class="text-base">きる</span></button>
    <button id="toolMove" aria-label="うごかす"><span class="text-4xl">👆</span><span class="text-base">うごかす</span></button>
    <div id="kanjiInfo" class="flex-1 min-h-0 overflow-y-auto border-t-2 border-orange-100 pt-2 text-center"></div>
  </aside>

  <main class="flex-1 min-w-0 bg-amber-100/70 border-4 border-orange-200 rounded-3xl shadow-lg p-2">
    <div id="canvasContainer" class="relative w-full h-full bg-[#fffdf6] rounded-2xl border-2 border-amber-200 overflow-hidden shadow-inner">
      <canvas id="kanjiCanvas" class="w-full h-full block"></canvas>
      <div id="slashOverlay" class="absolute inset-0 pointer-events-none"></div>
      <div class="absolute top-2 left-1/2 -translate-x-1/2 max-w-[70%] bg-white/90 border-2 border-orange-300 text-stone-700 px-4 py-1 rounded-full text-base font-bold text-center pointer-events-none shadow-sm"><span id="statusText"></span></div>
    </div>
  </main>
</div>

<div id="pickerModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-40 hidden flex items-center justify-center p-3">
  <div class="bg-white border-4 border-orange-200 rounded-3xl shadow-2xl w-full max-w-5xl flex flex-col" style="height:92dvh">
    <div class="flex items-center justify-between px-4 pt-3">
      <h3 class="samurai-title text-3xl text-orange-600">漢字をえらぼう</h3>
      <button id="pickerClose" class="h-11 bg-white hover:bg-rose-50 border-2 border-rose-300 text-stone-700 font-bold px-4 rounded-xl cursor-pointer active:scale-95">✕ とじる</button>
    </div>
    <div id="pickGrades" class="flex flex-wrap gap-2 px-4 pt-2"></div>
    <div id="pickTerms" class="flex flex-wrap gap-2 px-4 pt-2 empty:hidden"></div>
    <div class="flex items-center gap-2 px-4 pt-2">
      <label for="pickQuery" class="text-base font-bold text-stone-700">よみでさがす</label>
      <input id="pickQuery" type="text" placeholder="ひらがなで入力（れい：やま）" class="h-11 w-64 px-3 text-lg bg-white border-2 border-orange-300 rounded-xl text-stone-800 focus:outline-none focus:ring-4 focus:ring-orange-200">
      <span id="pickCount" class="text-sm font-bold text-stone-600"></span>
    </div>
    <div id="pickGrid" class="flex-1 min-h-0 overflow-y-auto p-4 grid gap-2 content-start" style="grid-template-columns:repeat(auto-fill,minmax(78px,1fr))"></div>
  </div>
</div>

<div id="messageModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white border-4 border-orange-200 rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center">
    <div id="modalIcon" class="text-5xl mb-2">⚔️</div>
    <h3 id="modalTitle" class="samurai-title text-2xl text-orange-600 mb-2"></h3>
    <p id="modalMessage" class="text-stone-700 text-base mb-6"></p>
    <button id="modalCloseBtn" class="bg-amber-300 hover:bg-amber-200 border-b-4 border-amber-500 text-stone-800 font-black px-6 py-3 rounded-xl shadow transition active:translate-y-0.5 w-full cursor-pointer">とじる</button>
  </div>
</div>

<script>

pickerModal.addEventListener('click', e => { if (e.target === pickerModal) closePicker(); });
$('pickerClose').addEventListener('click', closePicker);
$('pickBtn').addEventListener('click', openPicker);

// ---- ボタン類 ----
function summon(k, msg) { currentKanji = k; kanjiInput.value = k; statusText.textContent = msg + ' ' + HINT[mode]; initKanji(); }
setKanjiBtn.addEventListener('click', () => { const v = [...kanjiInput.value.trim()][0]; if (v) summon(v, `「${v}」にけってい！`); });
kanjiInput.addEventListener('keydown', e => { if (e.key === 'Enter') setKanjiBtn.click(); });
resetBtn.addEventListener('click', () => summon(currentKanji, `「${currentKanji}」をもとにもどしたよ。`));
undoBtn.addEventListener('click', () => {
  if (!history.length) return;
  const h = history.pop(); frags = h.list; cuts = h.cuts; view.ts = h.vs; path = []; dragIdx = -1;
  frags.forEach((f, i) => { f.tx = h.pos[i][0]; f.ty = h.pos[i][1]; f.hit = 0; });
  statusText.textContent = 'ひとつ前にもどしたよ。'; updateUI(); animate();
});
toolCut.addEventListener('click', () => setMode('cut'));
toolMove.addEventListener('click', () => setMode('move'));
window.addEventListener('load', () => { resizeCanvas(true); setMode('cut'); });
window.addEventListener('resize', () => resizeCanvas(false));
</script>
</body>
</html>
